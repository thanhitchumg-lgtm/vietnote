<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ghi Chú</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Ghi Chú">
    <meta name="theme-color" content="#f5f5f5">
    
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%23ffffff%22 rx=%2220%22/><text y=%22.8em%22 font-size=%2280%22 x=%2210%22>📝</text></svg>">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%23ffffff%22 rx=%2220%22/><text y=%22.8em%22 font-size=%2280%22 x=%2210%22>📝</text></svg>">

    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --toolbar-bg: #f5f5f5;
            --border-color: #e0e0e0;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body, html {
            margin: 0; padding: 0; height: 100%;
            background-color: var(--bg-color); color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .app-container {
            display: flex; flex-direction: column;
            height: 100dvh; max-width: 600px; margin: 0 auto;
            background-color: var(--bg-color);
        }

        .toolbar {
            display: flex; 
            padding: 10px 5px; 
            background-color: var(--toolbar-bg);
            border-bottom: 1px solid var(--border-color);
            align-items: center;
            justify-content: space-evenly; /* Tự động chia đều khoảng cách trên 1 dòng */
        }

        .toolbar button {
            background: none; border: none; color: var(--text-color);
            font-size: 19px; cursor: pointer; padding: 8px;
            border-radius: 4px; display: flex; align-items: center; justify-content: center;
        }
        .toolbar button:active { background-color: #e0e0e0; }

        .divider {
            width: 1px; height: 24px; background-color: #ccc; margin: 0 2px;
        }

        .editor {
            flex: 1; padding: 20px; font-size: 18px;
            outline: none; overflow-y: auto; line-height: 1.6;
        }

        .editor[placeholder]:empty:before {
            content: attr(placeholder); color: #999; pointer-events: none;
        }

        .editor ul, .editor ol { padding-left: 25px; margin-top: 5px; margin-bottom: 5px;}
        
        /* Tự động viết hoa chữ cái đầu tiên của các gạch đầu dòng */
        .editor li::first-letter { text-transform: uppercase; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- onmousedown="event.preventDefault();" giúp bôi đen chữ trên điện thoại bấm nút không bị mất bôi đen -->
        <div class="toolbar">
            <button onmousedown="event.preventDefault();" onclick="formatText('bold')" style="font-weight: bold;">B</button>
            <button onmousedown="event.preventDefault();" onclick="formatText('italic')" style="font-style: italic;">I</button>
            <button onmousedown="event.preventDefault();" onclick="formatText('underline')" style="text-decoration: underline;">U</button>
            
            <div class="divider"></div>
            
            <button onmousedown="event.preventDefault();" onclick="changeSelectedFontSize(-1)">a-</button>
            <button onmousedown="event.preventDefault();" onclick="changeSelectedFontSize(1)">a+</button>
            
            <div class="divider"></div>
            
            <button onmousedown="event.preventDefault();" onclick="changeGlobalFontSize(-2)">A-</button>
            <button onmousedown="event.preventDefault();" onclick="changeGlobalFontSize(2)">A+</button>
        </div>

        <div id="editor" class="editor" contenteditable="true" placeholder="Bắt đầu viết những gì chợt nảy ra trong đầu..."></div>
    </div>

    <script>
        const editor = document.getElementById('editor');
        let currentGlobalFontSize = 18;

        window.onload = () => {
            const savedContent = localStorage.getItem('myQuickNote_content');
            if (savedContent) editor.innerHTML = savedContent;
            
            const savedSize = localStorage.getItem('myQuickNote_globalFontSize');
            if (savedSize) {
                currentGlobalFontSize = parseInt(savedSize);
                editor.style.fontSize = currentGlobalFontSize + 'px';
            }
        };

        // Ghi nhận sự kiện nhập liệu mượt mà, không xung đột bộ gõ
        editor.addEventListener('input', () => {
            localStorage.setItem('myQuickNote_content', editor.innerHTML);

            const selection = window.getSelection();
            if (!selection.rangeCount) return;
            
            const node = selection.anchorNode;
            if (node && node.nodeType === Node.TEXT_NODE) {
                const text = node.textContent;
                
                // Logic tự động tạo danh sách an toàn
                if (text === '- ' || text === '. ') {
                    const range = document.createRange();
                    range.selectNodeContents(node);
                    selection.removeAllRanges();
                    selection.addRange(range);
                    document.execCommand('delete');
                    document.execCommand('insertUnorderedList');
                } else if (text === '1. ') {
                    const range = document.createRange();
                    range.selectNodeContents(node);
                    selection.removeAllRanges();
                    selection.addRange(range);
                    document.execCommand('delete');
                    document.execCommand('insertOrderedList');
                }
            }
        });

        function formatText(command) {
            document.execCommand(command, false, null);
            editor.focus(); 
            localStorage.setItem('myQuickNote_content', editor.innerHTML);
        }

        // Tăng giảm cỡ chữ ĐOẠN đang bôi đen
        function changeSelectedFontSize(step) {
            let currentSize = document.queryCommandValue("fontSize") || 3;
            let newSize = parseInt(currentSize) + step;
            if (newSize < 1) newSize = 1;
            if (newSize > 7) newSize = 7;
            
            document.execCommand("fontSize", false, newSize);
            editor.focus();
            localStorage.setItem('myQuickNote_content', editor.innerHTML);
        }

        // Tăng giảm cỡ chữ TOÀN BỘ trang
        function changeGlobalFontSize(step) {
            currentGlobalFontSize += step;
            if (currentGlobalFontSize < 12) currentGlobalFontSize = 12;
            if (currentGlobalFontSize > 40) currentGlobalFontSize = 40;
            
            editor.style.fontSize = currentGlobalFontSize + 'px';
            localStorage.setItem('myQuickNote_globalFontSize', currentGlobalFontSize);
        }
    </script>

</body>
</html>
