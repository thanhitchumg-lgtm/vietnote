<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ghi Chú</title>
    
    <!-- Cấu hình để biến thành App khi Share ra Home Screen -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Ghi Chú">
    <meta name="theme-color" content="#f5f5f5">
    
    <!-- Icon SVG hiển thị ngoài màn hình chính -->
    <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%23ffffff%22 rx=%2220%22/><text y=%22.8em%22 font-size=%2280%22 x=%2210%22>📝</text></svg>">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%23ffffff%22 rx=%2220%22/><text y=%22.8em%22 font-size=%2280%22 x=%2210%22>📝</text></svg>">

    <style>
        :root {
            --bg-color: #ffffff;
            --text-color: #000000;
            --toolbar-bg: #f5f5f5;
            --border-color: #e0e0e0;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body, html {
            margin: 0; padding: 0; height: 100%;
            background-color: var(--bg-color); color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .app-container {
            display: flex; flex-direction: column;
            height: 100dvh; max-width: 600px; margin: 0 auto;
            background-color: var(--bg-color);
        }

        .toolbar {
            display: flex; flex-wrap: wrap; gap: 8px;
            padding: 12px 15px; background-color: var(--toolbar-bg);
            border-bottom: 1px solid var(--border-color);
            align-items: center;
        }

        .toolbar button {
            background: none; border: none; color: var(--text-color);
            font-size: 18px; cursor: pointer; padding: 8px 10px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 4px;
        }
        .toolbar button:active { background-color: #e0e0e0; }

        .tool-group {
            display: flex; align-items: center;
            background: #ebebeb; border-radius: 6px; padding: 2px;
        }

        .group-label {
            font-size: 11px; color: #555;
            margin: 0 6px; font-weight: bold; text-transform: uppercase;
        }

        .editor {
            flex: 1; padding: 20px; font-size: 18px;
            outline: none; overflow-y: auto; line-height: 1.6;
        }

        .editor[placeholder]:empty:before {
            content: attr(placeholder); color: #999; pointer-events: none;
        }

        /* Định dạng danh sách đẹp hơn */
        .editor ul, .editor ol { padding-left: 25px; margin-top: 5px; margin-bottom: 5px;}
    </style>
</head>
<body>

    <div class="app-container">
        <div class="toolbar">
            <button onclick="formatText('bold')" style="font-weight: bold;">B</button>
            <button onclick="formatText('italic')" style="font-style: italic;">I</button>
            <button onclick="formatText('underline')" style="text-decoration: underline;">U</button>
            
            <!-- Tăng giảm cỡ chữ cho ĐOẠN đang bôi đen -->
            <div class="tool-group">
                <span class="group-label">Đoạn</span>
                <button onclick="changeSelectedFontSize(-1)">a-</button>
                <button onclick="changeSelectedFontSize(1)">a+</button>
            </div>

            <!-- Tăng giảm cỡ chữ cho TOÀN BỘ -->
            <div class="tool-group" style="margin-left: auto;">
                <span class="group-label">Toàn Bộ</span>
                <button onclick="changeGlobalFontSize(-2)">A-</button>
                <button onclick="changeGlobalFontSize(2)">A+</button>
            </div>
        </div>

        <div id="editor" class="editor" contenteditable="true" placeholder="Bắt đầu viết những gì chợt nảy ra trong đầu..."></div>
    </div>

    <script>
        const editor = document.getElementById('editor');
        let currentGlobalFontSize = 18;

        // 1. Tải dữ liệu ban đầu
        window.onload = () => {
            const savedContent = localStorage.getItem('myQuickNote_content');
            if (savedContent) editor.innerHTML = savedContent;
            
            const savedSize = localStorage.getItem('myQuickNote_globalFontSize');
            if (savedSize) {
                currentGlobalFontSize = parseInt(savedSize);
                editor.style.fontSize = currentGlobalFontSize + 'px';
            }
        };

        // 2. Lưu ngầm khi có thay đổi
        editor.addEventListener('input', () => {
            localStorage.setItem('myQuickNote_content', editor.innerHTML);
        });

        // 3. Xử lý logic gõ phím: Tự động Bullet, Số, và Viết hoa
        editor.addEventListener('keyup', function(e) {
            // Kiểm tra nếu phím gõ là Dấu cách (Space)
            if (e.key === ' ' || e.keyCode === 32) {
                const selection = window.getSelection();
                if (!selection.rangeCount) return;
                const node = selection.anchorNode;
                
                if (node.nodeType === Node.TEXT_NODE) {
                    const text = node.textContent;
                    const offset = selection.anchorOffset;
                    const textBefore = text.substring(0, offset);
                    
                    // --- Tự động tạo danh sách Bullet / Số ---
                    if (textBefore === '- ' || textBefore === '. ') {
                        if (offset === 2) {
                            document.execCommand('delete'); // Xóa dấu cách
                            document.execCommand('delete'); // Xóa '-' hoặc '.'
                            document.execCommand('insertUnorderedList'); // Chuyển thành chấm
                            return;
                        }
                    } else if (textBefore === '1. ') {
                        if (offset === 3) {
                            document.execCommand('delete'); document.execCommand('delete'); document.execCommand('delete');
                            document.execCommand('insertOrderedList'); // Chuyển thành số 1, 2, 3...
                            return;
                        }
                    }
                    
                    // --- Tự động viết hoa chữ cái đầu dòng ---
                    if (offset > 1) {
                        const wordStr = text.substring(0, offset - 1);
                        if (!wordStr.includes(' ') && wordStr.length > 0) {
                            let prev = node.previousSibling;
                            // Nếu đây là từ đầu tiên của dòng
                            if (!prev || prev.nodeName === 'BR' || prev.nodeName === 'DIV' || prev.nodeName === 'LI') {
                                const capWord = wordStr.charAt(0).toUpperCase() + wordStr.slice(1);
                                node.textContent = capWord + " " + text.substring(offset);
                                
                                // Đưa con trỏ chuột về đúng vị trí cũ
                                const range = document.createRange();
                                range.setStart(node, capWord.length + 1);
                                range.collapse(true);
                                selection.removeAllRanges(); selection.addRange(range);
                            }
                        }
                    }
                }
            }
            localStorage.setItem('myQuickNote_content', editor.innerHTML);
        });

        // 4. Các hàm định dạng cơ bản
        function formatText(command) {
            document.execCommand(command, false, null);
            editor.focus(); 
            localStorage.setItem('myQuickNote_content', editor.innerHTML);
        }

        // 5. Tăng giảm cỡ chữ cho ĐOẠN đang bôi đen (1 đến 7)
        function changeSelectedFontSize(step) {
            let currentSize = document.queryCommandValue("fontSize") || 3;
            let newSize = parseInt(currentSize) + step;
            if (newSize < 1) newSize = 1;
            if (newSize > 7) newSize = 7;
            
            document.execCommand("fontSize", false, newSize);
            editor.focus();
            localStorage.setItem('myQuickNote_content', editor.innerHTML);
        }

        // 6. Tăng giảm cỡ chữ cho TOÀN BỘ trang
        function changeGlobalFontSize(step) {
            currentGlobalFontSize += step;
            if (currentGlobalFontSize < 12) currentGlobalFontSize = 12;
            if (currentGlobalFontSize > 40) currentGlobalFontSize = 40;
            
            editor.style.fontSize = currentGlobalFontSize + 'px';
            localStorage.setItem('myQuickNote_globalFontSize', currentGlobalFontSize);
        }
    </script>

</body>
</html>
