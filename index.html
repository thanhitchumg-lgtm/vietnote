<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ghi Chú Nhanh</title>
    <style>
        :root {
            --bg-color: #ffffff;      /* Nền trắng */
            --text-color: #000000;    /* Chữ đen */
            --toolbar-bg: #f5f5f5;    /* Nền thanh công cụ xám nhạt */
            --border-color: #e0e0e0;  /* Viền xám nhạt */
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            height: 100dvh;
            max-width: 600px;
            margin: 0 auto;
            background-color: var(--bg-color);
        }

        .toolbar {
            display: flex;
            gap: 20px;
            padding: 15px 20px;
            background-color: var(--toolbar-bg);
            border-bottom: 1px solid var(--border-color);
            align-items: center;
        }

        .toolbar button {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 20px;
            cursor: pointer;
            padding: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .toolbar button:active {
            opacity: 0.5;
        }

        .editor {
            flex: 1;
            padding: 20px;
            font-size: 18px;
            outline: none;
            overflow-y: auto;
            line-height: 1.6;
        }

        /* Placeholder khi chưa nhập gì */
        .editor[placeholder]:empty:before {
            content: attr(placeholder);
            color: #999; /* Màu chữ mờ cho phần placeholder */
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="toolbar">
            <button onclick="formatText('bold')" style="font-weight: bold;">B</button>
            <button onclick="formatText('italic')" style="font-style: italic;">I</button>
            <button onclick="formatText('underline')" style="text-decoration: underline;">U</button>
            <button onclick="changeFontSize(2)" style="margin-left: auto;">A+</button>
            <button onclick="changeFontSize(-2)">A-</button>
        </div>

        <div id="editor" class="editor" contenteditable="true" placeholder="Bắt đầu viết những gì chợt nảy ra trong đầu..."></div>
    </div>

    <script>
        const editor = document.getElementById('editor');
        let currentFontSize = 18;

        window.onload = () => {
            const savedContent = localStorage.getItem('myQuickNote_content');
            if (savedContent) {
                editor.innerHTML = savedContent;
            }
            
            const savedSize = localStorage.getItem('myQuickNote_fontSize');
            if (savedSize) {
                currentFontSize = parseInt(savedSize);
                editor.style.fontSize = currentFontSize + 'px';
            }
        };

        editor.addEventListener('input', () => {
            localStorage.setItem('myQuickNote_content', editor.innerHTML);
        });

        function formatText(command) {
            document.execCommand(command, false, null);
            editor.focus(); 
            localStorage.setItem('myQuickNote_content', editor.innerHTML);
        }

        function changeFontSize(step) {
            currentFontSize += step;
            
            if (currentFontSize < 12) currentFontSize = 12;
            if (currentFontSize > 40) currentFontSize = 40;
            
            editor.style.fontSize = currentFontSize + 'px';
            localStorage.setItem('myQuickNote_fontSize', currentFontSize);
        }
    </script>

</body>
</html>
